<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Media - Ultimate WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="ultimate-styles.css">
</head>
<body>
    <!-- WebGL Background -->
    <canvas id="bgCanvas"></canvas>
    <canvas id="particleCanvas"></canvas>
    
    <!-- Spotlight Effect -->
    <div class="spotlight" id="spotlight"></div>
    
    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="loader-orb"></div>
        <div class="loader-text">NEXUS MEDIA</div>
    </div>
    
    <!-- Main App -->
    <div class="app" id="app">
        <!-- Header -->
        <div class="header">
            <div class="avatar" id="userAvatar">👤</div>
            <div class="user-info">
                <div class="user-name" id="userName">Foydalanuvchi</div>
                <div class="user-tier" id="userTier">Standard</div>
            </div>
            <div class="header-stats">
                <div class="header-stat">
                    <div class="header-stat-value" id="headerXP">0</div>
                    <div class="header-stat-label">XP</div>
                </div>
                <div class="header-stat">
                    <div class="header-stat-value" id="headerGold">0</div>
                    <div class="header-stat-label">Gold</div>
                </div>
            </div>
        </div>
        
        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-chip">
                <span class="icon">⭐</span>
                <span>Level</span>
                <span class="value" id="statLevel">1</span>
            </div>
            <div class="stat-chip">
                <span class="icon">🔥</span>
                <span>Streak</span>
                <span class="value" id="statStreak">0</span>
            </div>
            <div class="stat-chip">
                <span class="icon">👥</span>
                <span>Referral</span>
                <span class="value" id="statReferrals">0</span>
            </div>
            <div class="stat-chip" id="darkMatterStat" style="display:none">
                <span class="icon">🌀</span>
                <span>DM</span>
                <span class="value" id="statDarkMatter">0</span>
            </div>
        </div>
        
        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" data-tab="home">
                <span class="icon">🏠</span>
                <span>Bosh</span>
            </div>
            <div class="tab" data-tab="game">
                <span class="icon">🎮</span>
                <span>O'yin</span>
            </div>
            <div class="tab" data-tab="edu">
                <span class="icon">📚</span>
                <span>Ta'lim</span>
            </div>
            <div class="tab" data-tab="premium">
                <span class="icon">💎</span>
                <span>Premium</span>
            </div>
            <div class="tab" data-tab="admin" id="adminTab" style="display:none">
                <span class="icon">👑</span>
                <span>Admin</span>
            </div>
        </div>
        
        <!-- Content -->
        <div class="content">
            <div class="tab-content active" id="homeContent"></div>
            <div class="tab-content" id="gameContent"></div>
            <div class="tab-content" id="eduContent"></div>
            <div class="tab-content" id="premiumContent"></div>
            <div class="tab-content" id="adminContent"></div>
        </div>
    </div>
    
    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-title" id="modalTitle"></div>
            <div id="modalBody"></div>
            <button class="modal-close" onclick="closeModal()">Yopish</button>
        </div>
    </div>
    
    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" data-tab="home">
            <span class="icon">🏠</span>
            <span class="label">Bosh</span>
        </div>
        <div class="nav-item" data-tab="game">
            <span class="icon">🎮</span>
            <span class="label">O'yin</span>
        </div>
        <div class="nav-item" data-tab="edu">
            <span class="icon">📚</span>
            <span class="label">Ta'lim</span>
        </div>
        <div class="nav-item" data-tab="premium">
            <span class="icon">💎</span>
            <span class="label">Premium</span>
        </div>
    </div>
    
    <script src="ultimate-app.js"></script>
</body>
</html>
